<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speys Local Dashboard</title>
<link rel="icon" href="/logo.svg">
<style>
:root{--bg:#f6f6f7;--side:#efeff1;--line:#e4e4e7;--text:#18181b;--muted:#71717a;--hover:rgba(0,0,0,.05);--on:#fff;--brand:#fb7a01;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e10;--side:#17171a;--line:#2a2a2f;--text:#ececef;--muted:#9a9aa3;--hover:rgba(255,255,255,.06);--on:#26262b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
aside{width:232px;flex:none;display:flex;flex-direction:column;gap:14px;padding:14px 10px 10px;background:var(--side);border-right:1px solid var(--line);overflow:hidden}
/* Only the applet list scrolls: the name stays on top, Store and Settings at the bottom */
.kaydir{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;margin:0 -10px;padding:0 10px 8px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand img{width:30px;height:30px;border-radius:7px}
.brand b{display:block;font-size:14px;line-height:1.2}
.brand select{display:block;max-width:150px;margin:1px 0 0 -4px;padding:0 2px;border:0;background:transparent;color:var(--muted);font:12px/1.4 inherit;cursor:pointer}
h2{margin:0 0 4px;padding:0 8px;font-size:11px;font-weight:600;color:var(--muted)}
nav a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;color:inherit;text-decoration:none;cursor:pointer}
nav a:hover{background:var(--hover)}
nav a.on{background:var(--on);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
nav a.on svg{color:var(--brand)}
nav svg{width:18px;height:18px;flex:none}
nav .name{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
nav .bad{margin-left:auto;width:7px;height:7px;flex:none;border-radius:50%;background:var(--bad)}
.empty{margin:0;padding:0 8px;font-size:12px;color:var(--muted)}
code{font:12px ui-monospace,Menlo,Consolas,monospace}
.alt{flex:none;margin:0 -10px;padding:10px 10px 0;border-top:1px solid var(--line)}
.new-applet{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;border-radius:8px;background:none;color:var(--muted);font:inherit;text-align:left;cursor:pointer}
.new-applet:hover{background:var(--hover);color:inherit}
.new-applet svg{width:18px;height:18px;flex:none}
.popup{width:min(420px,calc(100vw - 32px));max-height:min(620px,calc(100vh - 48px));padding:0;border:1px solid var(--line);border-radius:14px;background:var(--side);color:inherit;overflow:hidden}
.popup[open]{display:flex;flex-direction:column}
.popup::backdrop{background:rgba(0,0,0,.5)}
.popup-bas{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line)}
.popup-bas h2{margin:0;font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;color:inherit}
.popup-kapat{flex:none;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer}
.popup-ic{overflow-y:auto;overscroll-behavior:contain;padding:6px 8px 10px}
.yeni{display:flex;flex-direction:column;gap:10px;padding:4px 8px 8px}
.yeni textarea{width:100%;min-height:72px;resize:vertical;box-sizing:border-box;font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.yeni small{color:var(--muted);line-height:1.45}
.yeni p{margin:0;line-height:1.45}
.yeni ul{margin:0;padding:0 0 0 18px;font-size:13px;line-height:1.55;color:var(--muted)}
.yeni h3{margin:6px 0 0;font-size:13px;font-weight:600}
.yeni pre{margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.yeni .ornekler{display:flex;flex-wrap:wrap;gap:6px}
.yeni .ornekler button{padding:4px 10px;font-size:12px;color:var(--muted);text-align:left}
.yeni .ornekler button:hover{color:inherit}
.yeni .dugmeler{display:flex;justify-content:flex-end;gap:8px}
.yeni button{border:1px solid var(--line);background:none;color:inherit;border-radius:99px;padding:7px 16px;font:inherit;cursor:pointer}
.yeni button.ana{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.yeni button:disabled{opacity:.5;cursor:default}
.update{margin-bottom:8px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--on);font-size:12px}
.update[hidden]{display:none}
.update p{margin:0 0 7px}
.update div{display:flex;gap:6px}
.update button{padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;font:inherit;cursor:pointer}
.update button:first-child{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
main{flex:1;min-width:0;display:flex}
iframe{flex:1;width:100%;height:100%;border:0;background:var(--bg)}
iframe[hidden]{display:none}
.message{margin:auto;max-width:440px;padding:24px;text-align:center;color:var(--muted)}
.message b{display:block;margin-bottom:6px;color:var(--text);font-size:16px}
@media (max-width:720px){aside{width:58px;padding:12px 8px}.kaydir,.alt{margin:0 -8px;padding-left:8px;padding-right:8px}.brand{justify-content:center;padding:0}.brand div,h2,.empty,.update,nav .name{display:none}nav a{justify-content:center}}
</style>
</head>
<body>
<aside>
  <div class="brand"><img src="/logo.svg" alt=""><div><b>Speys Local</b><select id="workspace" title=""></select></div></div>
  <div class="kaydir">
    <section id="dashboards-section"><h2 id="dashboards-title"></h2><nav id="dashboards"></nav></section>
    <section id="store-section"><h2 id="store-title"></h2><nav id="store"></nav></section>
    <section><h2 id="custom-title"></h2><nav id="custom"></nav><button type="button" class="new-applet" id="new-applet"></button></section>
  </div>
  <section class="alt">
    <div class="update" id="update" hidden><p id="update-text"></p><div><button type="button" id="update-see"></button><button type="button" id="update-later"></button></div></div>
    <nav id="system"></nav>
  </section>
</aside>
<main id="main"></main>
<script src="/kit.js"></script>
<script>
// The server restarts when its code changes. A page loading at that moment may miss kit.js: try again instead of staying blank.
if (!window.I18N) setTimeout(() => location.reload(), 1000);
</script>
<script>
$("#dashboards-title").textContent = t("Dashboards");
$("#custom-title").textContent = t("Custom");
$("#store-title").textContent = t("Applets");
const FALLBACK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>';
const nav = { dashboards: document.getElementById("dashboards"), custom: document.getElementById("custom"), store: document.getElementById("store"), system: document.getElementById("system") };
const SETTINGS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>';
const main = document.getElementById("main");
let applets = [];
let shown = null;
const frames = new Map();
const pendingHash = {};

// The address carries the place inside the applet too: #/<id>/<the applet's own hash>, so it can be shared and reopened
const route = () => {
  const [id, ...inner] = location.hash.slice(2).split("/");
  return { id: decodeURIComponent(id), inner: inner.join("/") };
};
const placeIn = (frame) => {
  try {
    return frame.contentWindow.location.href === "about:blank" ? null : frame.contentWindow.location.hash.slice(1);
  } catch {
    return null; // a frame on another address
  }
};
function goInside(frame, inner) {
  try {
    if (placeIn(frame) !== inner) frame.contentWindow.location.hash = inner;
  } catch { /* a frame on another address */ }
}
/** The address follows the visible applet without adding a step to the history (the frame keeps its own). */
function follow(id, frame) {
  const inner = placeIn(frame);
  if (shown !== id || inner === null) return;
  const next = `#/${id}${inner ? `/${inner}` : ""}`;
  if (location.hash !== next) history.replaceState(null, "", next);
}

/** One applet opens another (and a place inside it). */
window.openApplet = (id, inner) => {
  const next = `#/${id}${inner ? `/${inner}` : ""}`;
  if (location.hash === next) return render();
  location.hash = next;
};

function show(message, detail) {
  main.querySelector(".message")?.remove();
  for (const f of frames.values()) f.hidden = true;
  const box = document.createElement("div");
  box.className = "message";
  const title = document.createElement("b");
  title.textContent = message;
  box.append(title, detail || "");
  main.append(box);
}

// —— workspaces: separate settings and data, like the demo
const WORKSPACE_NAMES = { main: () => t("Main"), demo: () => t("Demo") };
const NEW_WORKSPACE = "__new";
async function drawWorkspaces() {
  const { active, list } = await untilServerAnswers("/api/workspaces");
  const picker = document.getElementById("workspace");
  const option = (value, label) => `<option value="${esc(value)}"${value === active ? " selected" : ""}>${esc(label)}</option>`;
  picker.innerHTML = list.map((id) => option(id, WORKSPACE_NAMES[id]?.() ?? id)).join("") + option(NEW_WORKSPACE, t("New workspace…"));
  picker.dataset.active = active;
  picker.title = t("Workspace");
}
document.getElementById("workspace").addEventListener("change", async (e) => {
  const picker = e.target, body = picker.value === NEW_WORKSPACE ? { create: prompt(t("Name of the new workspace")) } : { id: picker.value };
  if (picker.value === NEW_WORKSPACE && !body.create) { picker.value = picker.dataset.active; return; }
  const r = await fetch("/api/workspaces", { method: "POST", headers: { "Content-Type": "application/json", "X-Panel": "1" }, body: JSON.stringify(body) });
  if (!r.ok) { alert((await r.json().catch(() => ({}))).error || r.status); picker.value = picker.dataset.active; return; }
  location.hash = "";
  location.reload();
});

function render() {
  const { id: current, inner } = route();
  const open = applets.filter((m) => m.enabled !== false);
  const applet = open.find((m) => m.id === current) || open[0];
  for (const a of document.querySelectorAll("nav a")) a.classList.toggle("on", a.dataset.id === applet?.id);
  if (!applet) return show(t("No applets yet"), t("Add an applet under applets/custom/."));
  document.title = `${applet.name} · Speys Local Dashboard`;
  if (shown === applet.id) {
    // Same applet: a place in the address is opened; without one (its link in the sidebar) it stays where it was
    const frame = frames.get(applet.id);
    if (frame && inner) goInside(frame, inner);
    if (frame) follow(applet.id, frame);
    return;
  }
  shown = applet.id;
  if (applet.error) return show(t("{name} could not be opened", { name: applet.name }), applet.error);
  // An opened frame stays and is only hidden: switching is instant and its work is not lost
  let frame = frames.get(applet.id);
  if (!frame) {
    frame = document.createElement("iframe");
    const place = inner || pendingHash[applet.id];
    frame.src = applet.url + (place ? `#${place}` : "");
    delete pendingHash[applet.id];
    frame.title = applet.name;
    const id = applet.id;
    frame.addEventListener("load", () => {
      follow(id, frame);
      try { frame.contentWindow.addEventListener("hashchange", () => follow(id, frame)); } catch { /* frame on another address */ }
    });
    frames.set(applet.id, frame);
  } else if (inner) {
    goInside(frame, inner);
  }
  main.querySelector(".message")?.remove();
  if (!frame.isConnected) main.append(frame);
  for (const f of frames.values()) f.hidden = f !== frame;
  // An applet coming back from the background refreshes its data
  try { frame.contentWindow?.dispatchEvent(new Event("focus")); } catch { /* frame on another address */ }
  follow(applet.id, frame);
}

function link(applet) {
  const a = document.createElement("a");
  a.href = `#/${applet.id}`;
  a.dataset.id = applet.id;
  a.title = applet.description || applet.name;
  a.innerHTML = applet.icon || FALLBACK_ICON;
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = applet.name;
  a.append(name);
  if (applet.error) {
    const bad = document.createElement("span");
    bad.className = "bad";
    a.append(bad);
  }
  return a;
}

function drawNav() {
  for (const n of Object.values(nav)) n.replaceChildren();
  for (const applet of applets) if (applet.enabled !== false) nav[applet.dashboard ? "dashboards" : applet.visibility].append(link(applet));
  document.getElementById("store-section").hidden = !nav.store.children.length;
  document.getElementById("dashboards-section").hidden = !nav.dashboards.children.length;
  if (!nav.custom.children.length) {
    const hint = document.createElement("p");
    hint.className = "empty";
    hint.innerHTML = t("What you add under <code>applets/custom/</code> shows up here and stays out of git.");
    nav.custom.append(hint);
  }
}

/** The sidebar refreshes when an applet is switched on or off in Settings. */
window.refreshApplets = async () => {
  const list = await fetch("/api/applets").then((r) => r.json());
  applets = [...list, ...applets.filter((a) => a.visibility === "system")];
  drawNav();
  // A disabled applet's frame goes away
  for (const [id, frame] of frames) {
    if (applets.find((a) => a.id === id)?.enabled === false) { frame.remove(); frames.delete(id); }
  }
  render();
};

/** A page is not reloaded under a user who is typing or playing a video. */
function busy(frame) {
  try {
    const doc = frame.contentDocument;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(doc.activeElement?.tagName || "")) return true;
    return [...doc.querySelectorAll("video")].some((v) => !v.paused);
  } catch {
    return true;
  }
}

/** A frame of ours whose page can't be read holds the browser's error page: it opened while the server was restarting. */
function failedToLoad(id, frame) {
  if (!applets.find((a) => a.id === id)?.url?.startsWith("/")) return false; // a tool at another address can't be read anyway
  try {
    return !frame.contentWindow.location.href;
  } catch {
    return true;
  }
}

// —— a new update asks; "Later" holds until a newer one arrives
let updateShown = null, updateLater = null;
try { updateLater = localStorage.getItem("dashboard.updateLater"); } catch { /* private window */ }
document.getElementById("update-see").textContent = t("See updates");
document.getElementById("update-later").textContent = t("Later");
document.getElementById("update-see").addEventListener("click", () => window.openApplet("settings"));
document.getElementById("update-later").addEventListener("click", () => {
  updateLater = updateShown?.latest;
  try { localStorage.setItem("dashboard.updateLater", updateLater); } catch { /* private window */ }
  drawUpdate(updateShown);
});
function drawUpdate(update) {
  updateShown = update;
  document.getElementById("update").hidden = !update || update.latest === updateLater;
  if (update) document.getElementById("update-text").textContent = t("{n} new updates.", { n: update.count });
}

let seen = null;
async function watchVersion() {
  if (document.hidden) return;
  let v;
  try {
    v = await fetch("/api/version", { cache: "no-store" }).then((r) => r.json());
  } catch {
    return; // the server may be restarting
  }
  drawUpdate(v.update);
  // The server answers again: an error page would otherwise stay, and it also reads as busy below
  for (const [id, frame] of frames) {
    if (failedToLoad(id, frame)) frame.src = frame.src;
  }
  if (!seen) {
    seen = v;
    return;
  }
  const active = frames.get(shown);
  if (v.boot !== seen.boot || v.core !== seen.core) {
    if (active && busy(active)) return;
    // A full reload keeps the place inside the applet (tab, selected list)
    try {
      sessionStorage.setItem("dashboard.ic", JSON.stringify({ id: shown, hash: active?.contentWindow.location.hash.slice(1) || "" }));
    } catch { /* private window */ }
    return location.reload();
  }
  for (const [id, frame] of frames) {
    if (v.pages[id] === undefined || v.pages[id] === seen.pages[id] || busy(frame)) continue;
    seen.pages[id] = v.pages[id];
    frame.contentWindow.location.reload();
  }
  if (Object.keys(v.pages).join() !== Object.keys(seen.pages).join()) window.refreshApplets();
  seen = { ...v, pages: { ...v.pages, ...seen.pages } };
}

/** Also refreshes the visible applet's data, for applets without their own timer. */
function refreshActive() {
  if (document.hidden) return;
  try { frames.get(shown)?.contentWindow.dispatchEvent(new Event("focus")); } catch { /* frame on another address */ }
}

/** The same restart can also hit these first requests. */
async function untilServerAnswers(path) {
  for (;;) {
    try {
      const r = await fetch(path, { cache: "no-store" });
      if (r.ok) return await r.json();
    } catch { /* restarting */ }
    await new Promise((done) => setTimeout(done, 1000));
  }
}

async function start() {
  try {
    const kalan = JSON.parse(sessionStorage.getItem("dashboard.ic") || "null");
    sessionStorage.removeItem("dashboard.ic");
    if (kalan?.hash) pendingHash[kalan.id] = kalan.hash;
  } catch { /* private window */ }
  applets = await untilServerAnswers("/api/applets");
  applets.push({ id: "store", name: t("Store"), description: t("Applets you add with one click"), icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 5.5 4h13L20 9.5M4 9.5V20h16V9.5M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0M10 20v-5h4v5"/></svg>', visibility: "system", url: "/store" });
  applets.push({ id: "settings", name: t("Settings"), description: t("Settings on this computer"), icon: SETTINGS_ICON, visibility: "system", url: "/settings" });
  drawNav();
  render();
  const logo = document.querySelector(".brand img");
  if (!logo.complete || !logo.naturalWidth) logo.src = "/logo.svg";
}

addEventListener("hashchange", render);
// A page brought back from the browser's memory is old: load it fresh
addEventListener("pageshow", (e) => { if (e.persisted) location.reload(); });
addEventListener("focus", refreshActive);
document.addEventListener("visibilitychange", () => { refreshActive(); watchVersion(); });
setInterval(watchVersion, 2000);
setInterval(refreshActive, 30_000);
// —— New applet: nothing runs from here. It explains what an applet can be and hands over a prompt for Claude Code.
const newAppletButton = document.getElementById("new-applet");
newAppletButton.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="name">${esc(t("New applet"))}</span>`;
const APPLET_IDEAS = () => [t("Track my rent and subscriptions, and warn me a week before each payment"), t("A reading list with notes on each book"), t("My clients' invoices: who has paid and who hasn't"), t("A board showing the open pull requests of my repos")];

async function openNewApplet() {
  const { folder = "" } = await fetch("/api/new-applet").then((r) => r.json()).catch(() => ({}));
  const known = new Set(applets.map((a) => a.id));
  let watching = null;
  const popup = openPopup({ title: t("New applet"), onClose: () => clearInterval(watching) });
  popup.element.style.width = "min(560px,calc(100vw - 32px))";
  popup.element.style.maxHeight = "calc(100vh - 32px)";
  const command = `cd "${folder}" && claude`;
  popup.setBody(`<div class="yeni">
    <p>${esc(t("Applets are written by Claude Code, on your computer. Tell it what you want and it shows up here in the sidebar."))}</p>
    <ul>${[t("Its own page and its own data on this computer"), t("It can read your files and folders, or a service you connect"), t("It can use the data of your other applets, and Today can show it")].map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    <h3>${esc(t("1. What should it do?"))}</h3>
    <textarea data-idea placeholder="${esc(t("Write it in your own words"))}"></textarea>
    <div class="ornekler">${APPLET_IDEAS().map((x) => `<button type="button" data-example>${esc(x)}</button>`).join("")}</div>
    <h3>${esc(t("2. Copy the prompt"))}</h3>
    <pre data-prompt></pre>
    <div class="dugmeler"><button type="button" class="ana" data-copy="prompt" disabled>${esc(t("Copy prompt"))}</button></div>
    <h3>${esc(t("3. Paste it into Claude Code in this folder"))}</h3>
    <pre>${esc(command)}</pre>
    <div class="dugmeler"><button type="button" data-copy="command">${esc(t("Copy command"))}</button></div>
    <small data-ready>${esc(t("New applets show up in the sidebar by themselves. It stays out of git, and you can ask Claude to change it any time."))}</small>
  </div>`);
  const root = popup.element, idea = root.querySelector("[data-idea]"), prompt = root.querySelector("[data-prompt]"), copyPrompt = root.querySelector('[data-copy="prompt"]');
  const update = () => {
    const text = idea.value.trim();
    prompt.textContent = `${t("Add a new Speys Local applet under applets/custom/ that does this:")}\n\n${text || t("(what you wrote above)")}\n\n${t("Follow CONTRIBUTING.md. It should work right away from an empty state, with no settings and no dependencies.")}`;
    copyPrompt.disabled = !text;
  };
  update();
  idea.addEventListener("input", update);
  idea.focus();
  root.addEventListener("click", async (e) => {
    if (e.target.closest("[data-example]")) { idea.value = e.target.textContent; update(); return; }
    const copy = e.target.closest("[data-copy]");
    if (copy) {
      const text = copy.dataset.copy === "prompt" ? prompt.textContent : command;
      const label = copy.textContent;
      try {
        await navigator.clipboard.writeText(text);
        copy.textContent = t("Copied");
      } catch {
        copy.textContent = t("Select and copy it above");
      }
      setTimeout(() => { copy.textContent = label; }, 1800);
    }
    const open = e.target.closest("[data-open-new]");
    if (open) { popup.close(); window.openApplet(open.dataset.openNew); }
  });
  // Claude Code works elsewhere: when its folder appears, say so here
  watching = setInterval(async () => {
    const list = await fetch("/api/applets").then((r) => r.json()).catch(() => null);
    const made = list?.find((a) => !known.has(a.id));
    if (!made) return;
    clearInterval(watching);
    await window.refreshApplets();
    root.querySelector("[data-ready]").innerHTML = `<b>${esc(t("{name} is ready", { name: made.name }))}</b> <button type="button" class="ana" data-open-new="${esc(made.id)}">${esc(t("Open"))}</button>`;
    root.querySelector("[data-ready]").scrollIntoView({ block: "nearest" });
  }, 3000);
}
newAppletButton.addEventListener("click", openNewApplet);
// Coming back from the terminal, a new applet is already in the sidebar
addEventListener("focus", () => window.refreshApplets().catch(() => {}));

drawWorkspaces();
start().then(watchVersion);
</script>
</body>
